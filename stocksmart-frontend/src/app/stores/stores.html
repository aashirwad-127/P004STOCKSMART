<section class="page"><div class="page-head"><div><h1>Stores</h1><p>Manage stores records</p></div><span class="badge">{{items.length}} records</span></div>
<div class="panel"><h2>Add Store</h2><div class="form-grid"><label>Name<input type="text" [(ngModel)]="item.name" placeholder="Name"></label><label>Address<input type="text" [(ngModel)]="item.address" placeholder="Address"></label><label>City<input type="text" [(ngModel)]="item.city" placeholder="City"></label><label>Phone<input type="text" [(ngModel)]="item.phone" placeholder="Phone"></label></div><button class="primary" (click)="add()">Save</button><span class="message">{{message}}</span></div>
<div class="panel"><h2>Stores List</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>City</th><th>Address</th><th>Phone</th><th>Action</th></tr></thead><tbody><tr *ngFor="let x of items"><td>{{ x.id }}</td><td>{{ x.name }}</td><td>{{ x.city }}</td><td>{{ x.address }}</td><td>{{ x.phone }}</td><td><button class="danger" (click)="delete(x.id)">Delete</button></td></tr></tbody></table></div></div></section>
