<section class="page"><div class="page-head"><div><h1>Categories</h1><p>Manage categories records</p></div><span class="badge">{{items.length}} records</span></div>
<div class="panel"><h2>Add Categorie</h2><div class="form-grid"><label>Name<input type="text" [(ngModel)]="item.name" placeholder="Name"></label><label>Description<input type="text" [(ngModel)]="item.description" placeholder="Description"></label></div><button class="primary" (click)="add()">Save</button><span class="message">{{message}}</span></div>
<div class="panel"><h2>Categories List</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Description</th><th>Action</th></tr></thead><tbody><tr *ngFor="let x of items"><td>{{ x.id }}</td><td>{{ x.name }}</td><td>{{ x.description }}</td><td><button class="danger" (click)="delete(x.id)">Delete</button></td></tr></tbody></table></div></div></section>
