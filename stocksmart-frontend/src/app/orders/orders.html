<section class="page"><div class="page-head"><div><h1>Orders</h1><p>Create and manage customer orders</p></div><span class="badge">{{orders.length}} orders</span></div><div class="panel"><h2>Create Order</h2><div class="form-grid"><label>Customer<select [(ngModel)]="order.customer.id"><option [ngValue]="null">Select Customer</option><option *ngFor="let c of customers" [ngValue]="c.id">{{c.name}}</option></select></label><label>Store<select [(ngModel)]="order.store.id"><option [ngValue]="null">Select Store</option><option *ngFor="let s of stores" [ngValue]="s.id">{{s.name}}</option></select></label><label>Date<input type="date" [(ngModel)]="order.orderDate"></label><label>Total Amount<input type="number" [(ngModel)]="order.totalAmount"></label><label>Status<select [(ngModel)]="order.status"><option>PLACED</option><option>PROCESSING</option><option>COMPLETED</option><option>CANCELLED</option></select></label></div><button class="primary" (click)="add()">Create Order</button><span class="message">{{message}}</span></div>
<div class="panel"><h2>Order List</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>Customer</th><th>Store</th><th>Date</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody><tr *ngFor="let x of orders"><td>{{x.id}}</td><td>{{x.customer?.name}}</td><td>{{x.store?.name}}</td><td>{{x.orderDate}}</td><td>₹{{x.totalAmount}}</td><td><span class="tag">{{x.status}}</span></td><td><button class="danger" (click)="delete(x.id)">Delete</button></td></tr></tbody></table></div></div></section>
