<section class="page"><div class="page-head"><div><h1>Products</h1><p>Manage products records</p></div><span class="badge">{{items.length}} records</span></div>
<div class="panel"><h2>Add Product</h2><div class="form-grid"><label>SKU<input type="text" [(ngModel)]="item.sku" placeholder="SKU"></label><label>Name<input type="text" [(ngModel)]="item.name" placeholder="Name"></label><label>Price<input type="number" [(ngModel)]="item.price" placeholder="Price"></label><label>Quantity<input type="number" [(ngModel)]="item.quantity" placeholder="Quantity"></label><label>Reorder Level<input type="number" [(ngModel)]="item.reorderLevel" placeholder="Reorder Level"></label><label>Barcode<input type="text" [(ngModel)]="item.barcode" placeholder="Barcode"></label></div><button class="primary" (click)="add()">Save</button><span class="message">{{message}}</span></div>
<div class="panel"><h2>Products List</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>SKU</th><th>Name</th><th>Price</th><th>Qty</th><th>Reorder</th><th>Action</th></tr></thead><tbody><tr *ngFor="let x of items"><td>{{ x.id }}</td><td>{{ x.sku }}</td><td>{{ x.name }}</td><td>{{ x.price }}</td><td>{{ x.quantity }}</td><td>{{ x.reorderLevel }}</td><td><button class="danger" (click)="delete(x.id)">Delete</button></td></tr></tbody></table></div></div></section>
